name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress

      - name: Build selectable-folder installer
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version) { $version = "0.1.1" }
          ./packaging/build.ps1 -Python python -Version $version -Repository "${{ github.repository }}" -ExpectedPublisher "${{ vars.WINDOWS_SIGNING_PUBLISHER }}"

      - name: Import Windows signing certificate
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: powershell
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}")
          [IO.File]::WriteAllBytes("certificate.pfx", $bytes)

      - name: Sign installer
        if: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: powershell
        run: |
          & signtool sign /fd SHA256 /f certificate.pfx /p "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" /tr http://timestamp.digicert.com /td SHA256 artifacts/Alvi-Studio-Setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 artifacts/Alvi-Studio-Setup.exe).Hash.ToLowerInvariant()
          Set-Content artifacts/Alvi-Studio-Setup.exe.sha256 "$hash  Alvi-Studio-Setup.exe" -Encoding ASCII

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alvi-Studio-Windows
          path: artifacts/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
