name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NSIS
        shell: powershell
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          for ($attempt = 1; $attempt -le 3 -and -not (Test-Path -LiteralPath $makensis); $attempt++) {
            Write-Host "Installing NSIS (attempt $attempt of 3)"
            choco install nsis --yes --no-progress --force
            if (-not (Test-Path -LiteralPath $makensis) -and $attempt -lt 3) {
              Start-Sleep -Seconds 15
            }
          }
          if (-not (Test-Path -LiteralPath $makensis)) {
            throw "NSIS installation did not produce $makensis"
          }

      - name: Build selectable-folder installer
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if (-not $version) { $version = "0.1.7" }
          ./packaging/build.ps1 -Python python -Version $version -Repository "${{ github.repository }}" -ExpectedPublisher "${{ vars.WINDOWS_SIGNING_PUBLISHER }}"

      - name: Import Windows signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: powershell
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes("certificate.pfx", $bytes)

      - name: Sign installer
        if: ${{ env.WINDOWS_CERTIFICATE_BASE64 != '' }}
        shell: powershell
        run: |
          & signtool sign /fd SHA256 /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 artifacts/Alvi-Studio-Setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 artifacts/Alvi-Studio-Setup.exe).Hash.ToLowerInvariant()
          Set-Content artifacts/Alvi-Studio-Setup.exe.sha256 "$hash  Alvi-Studio-Setup.exe" -Encoding ASCII

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alvi-Studio-Windows
          path: artifacts/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
